# cargo-deny configuration (M0 §3.5). Run with `cargo deny check`.

[graph]
# Check every optional feature (CI runs `cargo deny check` without extra arguments).
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) crates pulled in by the required Tauri/specta stack. No fixed
# version exists; revisit when upstream drops them. Recorded in ADR 007.
ignore = [
  # paste: proc-macro used by specta/tauri-specta (=2.0.0-rc.26 pins, M0 §3.2).
  { id = "RUSTSEC-2024-0436", reason = "transitive via specta; unmaintained, no known vulnerability" },
  # proc-macro-error: via glib-macros 0.18 (gtk-rs, Linux webview stack used by tauri/wry).
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk-rs; unmaintained, no known vulnerability" },
  # The rest come only from typst 0.15.1 (the latest release), used solely by the M0 spike crate
  # `inkspark-spike-typst`, which is never a dependency of the app (M0 §2.1). typst-library
  # depends on them unconditionally, so there is no feature to drop them. Recorded in ADR 002;
  # revisit at the next typst release or before typst enters src-tauri.
  # bincode 1: via syntect (typst code highlighting); unmaintained, no known vulnerability.
  { id = "RUSTSEC-2025-0141", reason = "spike-only, via typst -> syntect; unmaintained, no known vulnerability" },
  # yaml-rust: via syntect; unmaintained, no known vulnerability.
  { id = "RUSTSEC-2024-0320", reason = "spike-only, via typst -> syntect; unmaintained, no known vulnerability" },
  # unsafe-libyaml: via serde_yaml -> hayagriva (typst bibliographies); unmaintained.
  { id = "RUSTSEC-2024-0449", reason = "spike-only, via typst -> hayagriva -> serde_yaml; unmaintained, no known vulnerability" },
  # rustybuzz and ttf-parser: typst's text shaping and font parsing; unmaintained.
  { id = "RUSTSEC-2026-0206", reason = "spike-only, via typst/krilla text shaping; unmaintained, no known vulnerability" },
  { id = "RUSTSEC-2026-0192", reason = "spike-only, via typst/fontdb font parsing; unmaintained, no known vulnerability" },
  # quick-xml 0.38 (via hayagriva -> citationberg, CSL styles): DoS on untrusted XML. The spike
  # never loads bibliographies or CSL files; the scriv spike uses the fixed quick-xml 0.42.
  { id = "RUSTSEC-2026-0194", reason = "spike-only, via typst -> hayagriva -> citationberg; no untrusted CSL/XML is parsed" },
  { id = "RUSTSEC-2026-0195", reason = "spike-only, via typst -> hayagriva -> citationberg; no untrusted CSL/XML is parsed" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is the project policy (CLAUDE.md), not just today's dependency set.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
]
# Anything else needs an explicit, commented exception here plus a mention in the relevant ADR.
exceptions = []

[licenses.private]
# Our own workspace crates are `publish = false` and MIT; skip them.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
