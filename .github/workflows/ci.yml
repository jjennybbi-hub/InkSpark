# M0 §3.8. Branch protection on main requires: check (x3), build-macos, e2e-linux, audit.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Bindings are up to date
        if: runner.os == 'Linux'
        run: npm run bindings:check

      - name: Build app (no bundle)
        if: runner.os != 'macOS'
        run: npm run tauri build -- --ci --no-bundle

  build-macos:
    name: build-macos
    runs-on: macos-15
    timeout-minutes: 75
    env:
      BUNDLE_DIR: target/universal-apple-darwin/release/bundle
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (universal)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build universal InkSpark.app
        run: npm run tauri build -- --ci --target universal-apple-darwin --bundles app

      - name: Smoke launch (stays alive 15 s)
        shell: bash
        run: |
          BIN="$BUNDLE_DIR/macos/InkSpark.app/Contents/MacOS/inkspark"
          lipo -info "$BIN"
          "$BIN" &
          PID=$!
          sleep 15
          if ! kill -0 "$PID"; then
            echo "::error::InkSpark exited before 15 s"
            exit 1
          fi
          kill "$PID"

      - name: Zip InkSpark.app
        id: zip
        shell: bash
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent "$BUNDLE_DIR/macos/InkSpark.app" artifacts/InkSpark-macos-universal.app.zip

      # Always upload the .app, even if the dmg step fails below (risk R3).
      - name: Upload .app
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: InkSpark-macos-universal-unsigned
          path: artifacts/InkSpark-macos-universal.app.zip
          retention-days: 30
          if-no-files-found: error

      - name: Build .dmg (attempt 1)
        id: dmg1
        continue-on-error: true
        timeout-minutes: 20
        run: npm run tauri build -- --ci --target universal-apple-darwin --bundles dmg

      - name: Build .dmg (retry)
        if: steps.dmg1.outcome == 'failure'
        timeout-minutes: 20
        run: npm run tauri build -- --ci --target universal-apple-darwin --bundles dmg

      - name: Collect .dmg
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=("$BUNDLE_DIR"/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::no .dmg produced"
            exit 1
          fi
          cp "${dmgs[@]}" artifacts/

      # Same artifact name: replaces the .app-only upload with .app zip + .dmg.
      - name: Upload .app and .dmg
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InkSpark-macos-universal-unsigned
          path: |
            artifacts/InkSpark-macos-universal.app.zip
            artifacts/*.dmg
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  e2e-linux:
    name: e2e-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential webkit2gtk-driver xvfb

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true

      - run: npm ci

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Build debug app
        run: npm run tauri build -- --debug --no-bundle

      - name: E2E smoke
        run: xvfb-run -a npm run test:e2e

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          rust-version: "1.97.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run audit
