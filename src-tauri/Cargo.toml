[package]
name = "inkspark"
version = "0.1.0"
description = "A calm, local-first writing app"
default-run = "inkspark"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "inkspark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "inkspark"
path = "src/main.rs"

# An example rather than a [[bin]]: the Tauri bundler packs every [[bin]] into the .app,
# and binding generation is a dev tool that must not ship (ADR 007).
[[example]]
name = "export-bindings"
path = "examples/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Release candidates: exact pins (M0 §3.2, risk R1). Upgrades only via the Orchestrator.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2"

[lints]
workspace = true
