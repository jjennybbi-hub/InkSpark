<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>InkSpark editor text spike</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          "Noto Sans",
          "Noto Sans CJK JP",
          "Hiragino Sans",
          "Noto Sans Hebrew",
          "Noto Sans Arabic",
          sans-serif;
        font-size: 16px;
        line-height: 1.8;
        color: #1a1a1a;
        background: #fafaf7;
      }
      body {
        margin: 0;
        padding: 16px;
      }
      /*
       * All four editors fit the 1280×720 test viewport (Playwright "Desktop Chrome" and
       * "Desktop Safari") in a 2×2 grid, so the window never scrolls: ltr and rtl on the first
       * row, vertical-rl and vertical-lr on the second. Each host is 616×330 px and scrolls its
       * own content. 16 + 330 + 16 + 330 + 16 = 708 px tall.
       */
      #app {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: 330px;
        gap: 16px;
      }
      /*
       * In the vertical hosts a line is 330 - 2 - 24 = 304 px long (about 19 characters at
       * 16 px), so a 10-character test line stays on one line, and a 200-character paragraph
       * wraps over about 11 lines of 28.8 px (about 317 px), inside the 616 px-wide host.
       */
      [data-testid^="editor-"] {
        box-sizing: border-box;
        min-width: 0;
        overflow: auto;
        /* About 3.5:1 against the white editor and 3.3:1 against the page (WCAG 1.4.11). */
        border: 1px solid #8a8a82;
        background: #fff;
      }
      .ProseMirror {
        box-sizing: border-box;
        min-block-size: 100%;
        padding: 12px;
        outline: none;
      }
      .ProseMirror p {
        margin-block: 0 0.6em;
      }
      .ProseMirror:focus-visible {
        outline: 2px solid #1f5fbf;
        outline-offset: -2px;
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Editor text spike"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
