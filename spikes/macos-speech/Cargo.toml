[package]
name = "inkspark-spike-speech"
version = "0.0.0"
description = "M0 spike: on-device macOS speech via objc2 (ADR 005)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "speech-spike"
path = "src/bin/speech-spike.rs"

[dependencies]
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-speech = "0.3"
objc2-avf-audio = "0.3"
block2 = "0.6"

# Not `workspace = true`: this is the one crate allowed `unsafe`, confined to `src/macos/`
# (M0 §6.1). The clippy level matches the workspace.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
