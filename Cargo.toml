[workspace]
resolver = "3"
members = [
  "src-tauri",
  "spikes/typst-pdf",
  "spikes/fts5-encyclopedia",
  "spikes/scriv-parser",
  "spikes/macos-speech",
]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
