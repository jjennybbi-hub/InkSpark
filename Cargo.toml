[workspace]
resolver = "3"
# The Orchestrator adds the spike crates at the M0 stub step (M0 §3.1).
members = ["src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
